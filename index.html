<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Шахматный класс</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
<style>
.clearfix-7da63:after{content:'.';visibility:hidden;display:block;height:0;clear:both}
.board-b72b1{border:2px solid #404040;box-sizing:content-box}.board-b72b1 *{box-sizing:content-box}
.square-55d63{float:left;position:relative;user-select:none;-webkit-user-select:none}
.white-1e1d7{background:#f0d9b5;color:#b58863}.black-3c85d{background:#b58863;color:#f0d9b5}
.highlight1-32417,.highlight2-9c5d2{box-shadow:inset 0 0 3px 3px #ff0}
.notation-322f9{cursor:default;font:14px Helvetica,Arial;position:absolute}.alpha-d2270{bottom:1px;right:3px}.numeric-fc462{top:2px;left:2px}
.piece-417db{width:100%;height:100%}.spare-pieces-7492f{padding:0}
*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',sans-serif;background:#f3efe6;color:#2b2b2b}
.hide{display:none!important}.card{background:#fff;border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,.09);padding:16px;margin:12px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 18px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}.bar b{flex:1}
button,.b{border:0;border-radius:10px;padding:8px 14px;background:#3b82c4;color:#fff;font:inherit;cursor:pointer;margin:2px}
button.g{background:#5a9a3c}button.red{background:#c44b3b}button.gray{background:#8a8a8a}button:disabled{background:#bbb;cursor:not-allowed}
input,textarea{font:inherit;padding:8px;border:1px solid #ccc;border-radius:10px}
#login .card{max-width:340px;margin:12vh auto;text-align:center}#login input{width:100%;margin:6px 0}#err{color:#c44b3b;min-height:20px}
.ok{color:#3b8a2c;font-weight:600;margin-bottom:6px}.st{border-top:1px solid #eee;padding:10px 0}.st textarea{width:100%;height:50px}.st input{width:90px}
.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:0}@media(max-width:900px){.grid{grid-template-columns:1fr}}
#camWrap{position:relative;height:430px;border-radius:12px;overflow:hidden;background:#222}#jf{width:100%;height:100%;border:0}
#vcam{position:absolute;inset:0;background:#f3efe6;display:flex;flex-direction:column;align-items:center;justify-content:center}#vcamb{width:400px;max-width:90%}
#bd{width:100%;max-width:440px;margin:auto}.clk{font-weight:700;font-size:18px;padding:4px 8px;background:#eef3e8;border-radius:8px;max-width:440px;margin:6px auto}
#stat{text-align:center;margin-bottom:4px;color:#555}.row{text-align:center;margin-top:8px}
.mini{display:inline-block;width:150px;text-align:center;margin:6px;vertical-align:top;font-size:12px}
.tab{background:#ddd;color:#333}.tab.on{background:#5a9a3c;color:#fff}.hl{border-top:1px solid #eee;padding:6px 0;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50}
.modal .card{max-height:94vh;overflow:auto;margin:0}#fsb{width:450px}
#notice{position:fixed;top:14px;right:14px;z-index:99;background:#fff;border-left:6px solid #5a9a3c;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:14px 18px;max-width:320px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:20px;z-index:99}
</style></head><body>

<div id="login"><div class="card"><h2>♞ Шахматный класс</h2>
<input id="lg" placeholder="Логин"><input id="ps" type="password" placeholder="Пароль" onkeydown="if(event.key=='Enter')login()">
<div id="err"></div><button class="g" onclick="login()">Войти</button></div></div>

<div id="cab" class="hide"><div class="bar"><b id="cabName"></b><button class="red" onclick="logout()">Выйти из аккаунта</button></div>
<div class="card" id="lessonBox"></div><div id="cabBody"></div></div>

<div id="room" class="hide"><div class="bar"><b>♟ Комната урока</b>
<button class="gray" onclick="go('cab')">В кабинет</button><button onclick="rejoin()">🔄 Переподключить видео</button><button class="g" onclick="openPick()">Кинуть вызов</button></div>
<div class="grid"><div>
<div class="card"><div id="camWrap"><iframe id="jf" allow="camera;microphone;display-capture;fullscreen;autoplay"></iframe>
<div id="vcam" class="hide"><div id="vcamb"></div><b>Доска учителя</b></div></div>
<div id="tools" class="row hide"><button class="g" onclick="pos0()">Начальная позиция</button><button class="red" onclick="clr()">Очистить доску</button>
<button id="bCam" onclick="camSet(!camOn)">Показать доску вместо камеры</button></div></div>
<div class="card hide" id="tp"><button class="tab on" id="t1" onclick="tab(1)">Партии сейчас</button><button class="tab" id="t2" onclick="tab(2)">Проведённые партии</button>
<div id="minis"></div><div id="noMini">Сейчас никто не играет</div><div id="hist" class="hide"></div></div>
</div>
<div class="card"><div id="stat"></div><div class="clk" id="ct"></div><div id="bd"></div><div class="clk" id="cb"></div>
<div class="row"><button id="bFlip" class="g hide" onclick="flipB()" style="width:100%;max-width:440px;font-size:16px">🔄 Перевернуть доску</button></div>
<div class="row"><button id="bBack" class="gray hide" onclick="back()">← К моей доске</button><button onclick="openFs()">🔲 Развернуть доску (на полэкрана)</button>
<button id="bR" class="red hide" onclick="resign()">Сдаться</button><button id="bD" class="hide" onclick="offerDraw()">Ничья</button></div></div></div></div>

<div id="fs" class="modal hide"><div class="card"><div id="fsb"></div><div class="row"><span id="fsTools"><button class="g" onclick="pos0()">Начальная позиция</button><button class="red" onclick="clr()">Очистить</button></span><button id="bFlip2" class="hide" onclick="flipB()">🔄 Перевернуть</button><button class="gray" onclick="closeFs()">Закрыть</button></div></div></div>
<div id="pick" class="modal hide"><div class="card"><h3>Кому бросить вызов?</h3><div id="pl"></div><button class="gray" onclick="$('pick').classList.add('hide')">Отмена</button></div></div>
<div id="notice" class="hide"></div><div id="toast" class="hide"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
<script>window.Chessboard||document.write('<script src="https://cdn.jsdelivr.net/npm/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"><\/script>')</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>window.Chess||document.write('<script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js"><\/script>')</script>
<script>
const START='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1',EMPTY='8/8/8/8/8/8/8/8 w - - 0 1';
const usersDB={teacher:[{id:'MrQafri-0620',name:'Гафур Мустафа',pass:'0620'}],students:[
{id:'Murik-855',name:'Мурад Солтанов',pass:'865789',rating:100},{id:'kenancik228',name:'Кянан Алиев',pass:'263573',rating:100},
{id:'redjohn335',name:'Исмаилов Омяр',pass:'937637',rating:950},{id:'professor-562',name:'Джавад Багырлы',pass:'023846',rating:100},
{id:'more788',name:'Дениз Новрузлу',pass:'040567',rating:450},{id:'elsik437',name:'Эльсевер Гусейнов',pass:'487598',rating:280}]};
const ALL=[...usersDB.teacher.map(u=>({...u,role:'t'})),...usersDB.students.map(u=>({...u,role:'s'}))];
const GR={weak:'Слабые'},GL={K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟'};
const theme=p=>'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45"><text x="22.5" y="37" font-size="40" text-anchor="middle" font-family="Segoe UI Symbol,Arial Unicode MS,DejaVu Sans,sans-serif" fill="'+(p[0]==='w'?'#fff':'#111')+'" stroke="#111" stroke-width="'+(p[0]==='w'?1.3:0.5)+'">'+GL[p[1]]+'</text></svg>');
const $=id=>document.getElementById(id),G=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},S=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),
esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me,game=new Chess(),board,fsb,vcam,mode='free',mid=null,viewFen=START,freeFen=START,camOn=false,loose=false,minis={},seenChal=0,seenRes=0,done={},ownId=null,busy=0,curView='cab',jLoaded=false,curChal=null;
const T=()=>me.role==='t',user=id=>ALL.find(u=>u.id===id),nm=id=>user(id).name,STU=()=>ALL.filter(u=>u.role==='s'),
cls=()=>G('cls')||{r:{},n:{},g:{},s:{}},susp=id=>!!((cls().s||{})[id]),rate=u=>cls().r[u.id]??u.rating,lessonOn=()=>{const l=G('lesson');return !!(l&&l.active)};
function toast(t){const e=$('toast');e.textContent=t;e.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hide'),3000)}
function note(h){const n=$('notice');n.innerHTML=h+'<div class="row"><button onclick="$(\'notice\').classList.add(\'hide\')">OK</button></div>';n.classList.remove('hide')}

/* ---------- вход / сессия ---------- */
function login(){const u=ALL.find(x=>x.id===$('lg').value.trim()&&x.pass===$('ps').value);
 if(!u){$('err').textContent='Неверный логин или пароль';return}sessionStorage.setItem('u',u.id);sessionStorage.setItem('v','cab');start(u)}
function logout(){sessionStorage.clear();location.reload()}
function start(u){me=u;$('cabName').textContent=u.name+(T()?' (учитель)':'');if(T())S('teacher_virtual_cam_fen',{on:false});
 go(sessionStorage.getItem('v')==='room'&&lessonOn()?'room':'cab');setInterval(tick,500);window.addEventListener('storage',tick)}
function kick(){jLoaded=false;$('jf').src='about:blank'}
function go(v){if(v==='room'&&!T()&&susp(me.id)){toast('Вы отстранены от урока');v='cab'}
 curView=v;sessionStorage.setItem('v',v);$('login').classList.add('hide');['cab','room'].forEach(x=>$(x).classList.toggle('hide',x!==v));v==='room'?initRoom():renderCab()}

/* ---------- кабинет ---------- */
function lessonHtml(){const on=lessonOn();
 if(T())return on?'<div class="ok">🟢 Урок идёт</div><button class="g" onclick="go(\'room\')">Войти в урок</button><button class="red" onclick="endL()">Завершить урок</button>':'<div>⚪ Урок не начат</div><button class="g" onclick="startL()">Начать урок</button>';
 if(susp(me.id))return '<div style="color:#c44b3b;font-weight:600">⛔ Вы отстранены от урока учителем</div><button disabled>Присоединиться</button>';
 return on?'<div class="ok">🟢 Урок начат</div><button class="g" onclick="go(\'room\')">Присоединиться</button>':'<div>⚪ Учитель ещё не начал урок</div><button disabled>Присоединиться</button>'}
function startL(){S('lesson',{active:true,ts:Date.now()});S('teacher_virtual_cam_fen',{on:false});go('room')}
function endL(){if(!confirm('Завершить урок для всех?'))return;S('lesson',{active:false});camSet(false);go('cab')}
function stuBody(){const n=(cls().n[me.id]||[]).slice().reverse();
 return '<div class="card"><h3>Мой рейтинг: '+rate(me)+'</h3></div><div class="card"><h3>Замечания учителя</h3>'+(n.length?n.map(x=>'<div class="hl"><small>'+new Date(x.t).toLocaleString()+'</small><br>'+esc(x.x)+'</div>').join(''):'Замечаний нет')+'</div>'}
function teacherBody(){const c=cls();return Object.keys(GR).map(g=>{const l=STU().map((u,i)=>[u,i]).filter(([u])=>(c.g[u.id]||'weak')===g);
 return '<div class="card"><h3>Группа «'+GR[g]+'» ('+l.length+')</h3>'+l.map(([u,i])=>'<div class="st"><button class="'+(susp(u.id)?'g':'red')+'" onclick="toggleS('+i+')">'+(susp(u.id)?'Вернуть':'Отстранить')+'</button> <b>'+u.name+(susp(u.id)?' ⛔':'')+'</b> <small>'+u.id+'</small><div>Рейтинг: <input type="number" id="r'+i+'" value="'+rate(u)+'"><button onclick="setR('+i+')">Сохранить</button></div>'+
 ((c.n[u.id]||[]).map((x,k)=>'<div class="hl">'+esc(x.x)+' <button class="gray" onclick="delN('+i+','+k+')">×</button></div>').join(''))+
 '<textarea id="n'+i+'" placeholder="Замечание ученику"></textarea><button class="g" onclick="addN('+i+')">Отправить замечание</button></div>').join('')+'</div>'}).join('')}
function renderCab(){const h=T()?teacherBody():stuBody();$('cabBody').innerHTML=h;$('cabBody').dataset.h=h;$('lessonBox').dataset.h='';tick()}
function toggleS(i){const c=cls(),id=STU()[i].id;c.s=c.s||{};if(c.s[id])delete c.s[id];else c.s[id]=1;S('cls',c);renderCab()}
function setR(i){const v=parseInt($('r'+i).value);if(isNaN(v))return;const c=cls();c.r[STU()[i].id]=v;S('cls',c);toast('Рейтинг сохранён')}
function addN(i){const t=$('n'+i).value.trim();if(!t)return;const c=cls(),id=STU()[i].id;(c.n[id]=c.n[id]||[]).push({t:Date.now(),x:t});S('cls',c);renderCab()}
function delN(i,k){const c=cls();c.n[STU()[i].id].splice(k,1);S('cls',c);renderCab()}

/* ---------- комната / видео ---------- */
const JROOM='https://meet.jit.si/MrQafurChessMasterClass2026';
function jurl(){const tb=encodeURIComponent(JSON.stringify(['microphone','camera','desktop','fullscreen','tileview','chat','hangup','settings']));
 return JROOM+'#config.p2p.enabled=true&config.prejoinPageEnabled=false&config.disableDeepLinking=true&config.toolbarButtons='+tb+'&userInfo.displayName='+encodeURIComponent(JSON.stringify(me.name))}
function rejoin(){$('jf').src='about:blank';setTimeout(()=>$('jf').src=jurl(),300)}
function initRoom(){if(!window.Chessboard||!window.Chess){alert('Не загрузились библиотеки доски (Chessboard.js / Chess.js). Проверьте интернет или отключите блокировщик и обновите страницу.');return}
 if(!board){board=Chessboard('bd',{position:freeFen,pieceTheme:theme,draggable:true,onDragStart:ds,onDrop:dr,onSnapEnd:se});
 $('bFlip').classList.toggle('hide',!T());$('tools').classList.toggle('hide',!T());$('tp').classList.toggle('hide',!T())}
 if(!jLoaded){jLoaded=true;$('jf').src=jurl()}board.resize();refresh()}
window.addEventListener('resize',()=>{board&&board.resize();vcam&&vcam.resize()});
function tab(n){$('t1').classList.toggle('on',n==1);$('t2').classList.toggle('on',n==2);$('minis').classList.toggle('hide',n!=1);$('noMini').dataset.t=n;$('hist').classList.toggle('hide',n!=2)}

/* ---------- доска ---------- */
const myMatch=()=>{const id=G('active_'+me.id);return id?G('match_fen_'+id):null},col=m=>m.w===me.id?'w':'b';
const rem=(m,c)=>m[c+'t']-(m.status==='play'&&m.ts!==null&&m.turn===c?Date.now()-m.ts:0);
function curFen(){if(mode==='match'){const m=myMatch();return m?m.fen:freeFen}
 if(mode==='view'){const m=mid&&G('match_fen_'+mid);return m?m.fen:viewFen}return freeFen}
let flip=false;
function setOri(){let b='white';if(mode==='match'){const m=myMatch();if(m&&m.b===me.id)b='black'}
 const o=(b==='white')!==flip?'white':'black';[board,fsb].forEach(x=>{if(x&&x.orientation()!==o)x.orientation(o)});return o}
function flipB(){flip=!flip;refresh()}
function refresh(){const f=curFen(),b=f.split(' ')[0],o=setOri();[board,fsb].forEach(x=>{if(x&&x.fen()!==b)x.position(f,false)});
 if(T()&&camOn)S('teacher_virtual_cam_fen',{on:true,fen:f,o});ui()}
function ds(src,piece){
 if(mode==='view')return false;
 if(mode==='match'){const m=myMatch();if(!m||m.status!=='play'||m.turn!==col(m)||piece[0]!==m.turn)return false;game.load(m.fen);return}
 loose=!game.load(freeFen);if(!loose&&game.game_over())return false}
function dr(s,t){if(t==='offboard')return 'snapback';if(loose)return;
 const mv=game.move({from:s,to:t,promotion:'q'});if(!mv)return 'snapback';
 if(mode==='match')commit(mv);else freeFen=game.fen()}
function se(){if(loose&&mode==='free'&&T()&&board)freeFen=Chessboard.objToFen(board.position())+' w - - 0 1';refresh()}
function commit(mv){const m=myMatch(),c=m.turn;if(m.ts!==null)m[c+'t']=rem(m,c)+5000;
 m.fen=game.fen();m.turn=c==='w'?'b':'w';m.moves.push(mv.san);m.ts=Date.now();m.draw=null;S('match_fen_'+m.id,m);
 if(game.in_checkmate())fin(m,c==='w'?'1-0':'0-1','checkmate');else if(game.in_draw())fin(m,'1/2-1/2','draw')}
function fin(m,res,why){m=G('match_fen_'+m.id);if(!m||m.status!=='play')return;m.status='over';m.result=res;m.reason=why;S('match_fen_'+m.id,m);
 const h=G('history')||[];h.push({id:m.id,w:m.w,b:m.b,fen:m.fen,res,why,ts:Date.now(),moves:m.moves});S('history',h)}
function msg(m){const w=m.result==='1-0'?m.w:m.result==='0-1'?m.b:null;if(!w)return '🤝 Партия завершилась вничью';const win=w===me.id;
 const R={resign:win?'соперник сдался':'вы сдались',timeout:win?'у соперника вышло время':'у вас вышло время',checkmate:'мат'}[m.reason];
 return win?'🏆 <b>Вы победили!</b> ('+R+')':'Вы проиграли ('+R+')'}
function resign(){const m=myMatch();if(m&&m.status==='play'&&confirm('Точно сдаться?'))fin(m,col(m)==='w'?'0-1':'1-0','resign')}
function offerDraw(){const m=myMatch();if(m&&m.status==='play'&&confirm('Предложить ничью?')){m.draw=me.id;S('match_fen_'+m.id,m);toast('Предложение отправлено')}}
const fmt=ms=>{const s=Math.ceil(Math.max(0,ms)/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function ui(){if(!board)return;const m=mode==='match'?myMatch():(mode==='view'&&mid?G('match_fen_'+mid):null);
 ['ct','cb'].forEach(x=>$(x).classList.toggle('hide',!m));
 let s=mode==='free'?(T()?'Ваша свободная доска':'Свободная доска (тренировка)'):mode==='view'&&!m?'Просмотр сыгранной партии':'';
 if(m){const bt=mode==='match'&&m.b===me.id?'b':'w',tp=bt==='w'?'b':'w',l=(c,id)=>nm(m[id])+(c==='w'?' ⚪ ':' ⚫ ')+fmt(rem(m,c));
  $('cb').textContent=l(bt,bt);$('ct').textContent=l(tp,tp);
  s=(mode==='view'?'Просмотр: ':'')+(m.status==='play'?'Ход '+(m.turn==='w'?'белых':'чёрных'):'Партия окончена '+m.result)}
 $('stat').textContent=s;const pl=mode==='match'&&m&&m.status==='play';$('bR').classList.toggle('hide',!pl);$('bD').classList.toggle('hide',!pl);
 $('bBack').classList.toggle('hide',mode!=='view');$('bCam').textContent=camOn?'Вернуть камеру':'Показать доску вместо камеры'}

/* ---------- инструменты учителя ---------- */
function ownFree(){const m=myMatch();if(m&&m.status==='play'){alert('Идёт ваша партия');return false}mode='free';mid=null;return true}
function pos0(){if(ownFree()){freeFen=START;refresh()}}
function clr(){if(ownFree()){freeFen=EMPTY;refresh()}}
function back(){const m=myMatch();if(m&&m.status==='play'){mode='match';mid=m.id}else{mode='free';mid=null}refresh()}
function watch(id,cam){mode='view';mid=id;if(cam)camSet(true);refresh()}
function watchH(i,cam){const h=(G('history')||[])[i];mode='view';mid=null;viewFen=h.fen;if(cam)camSet(true);refresh()}
function camSet(on){camOn=on;if(!on)S('teacher_virtual_cam_fen',{on:false});refresh()}
function camUpd(){const c=G('teacher_virtual_cam_fen'),on=!!(c&&c.on);$('vcam').classList.toggle('hide',!on);
 if(on){if(!vcam)vcam=Chessboard('vcamb',{position:c.fen,pieceTheme:theme});else if(vcam.fen()!==c.fen.split(' ')[0])vcam.position(c.fen,false);
  const o=c.o||'white';if(vcam.orientation()!==o)vcam.orientation(o)}}
function minisUpd(){const act=Object.keys(localStorage).filter(k=>k.startsWith('match_fen_')).map(G).filter(m=>m&&m.status==='play');
 Object.keys(minis).forEach(id=>{if(!act.find(m=>m.id==id)){minis[id].destroy();delete minis[id];$('mw'+id)&&$('mw'+id).remove()}});
 act.forEach(m=>{if(!minis[m.id]){const d=document.createElement('div');d.className='mini';d.id='mw'+m.id;
  d.innerHTML='<div id="mb'+m.id+'" style="width:130px;margin:auto"></div>'+nm(m.w)+' — '+nm(m.b)+'<br><button onclick="watch('+m.id+')">Демо</button><button class="g" onclick="watch('+m.id+',1)">На камеру</button>';
  $('minis').appendChild(d);minis[m.id]=Chessboard('mb'+m.id,{position:m.fen,pieceTheme:theme,showNotation:false})}
  else if(minis[m.id].fen()!==m.fen.split(' ')[0])minis[m.id].position(m.fen,false)});
 $('noMini').classList.toggle('hide',act.length>0||$('noMini').dataset.t==2)}
function histUpd(){const h=G('history')||[];if($('hist').dataset.n==h.length)return;$('hist').dataset.n=h.length;
 $('hist').innerHTML=h.length?h.map((x,i)=>[x,i]).reverse().map(([x,i])=>'<div class="hl">'+nm(x.w)+' — '+nm(x.b)+' <b>'+x.res+'</b> ('+x.why+', '+new Date(x.ts).toLocaleTimeString()+') <button onclick="watchH('+i+')">На мою доску</button><button class="g" onclick="watchH('+i+',1)">Вместо камеры</button></div>').join(''):'Сыгранных партий пока нет'}

function openPick(){$('pl').innerHTML=ALL.filter(u=>u.id!==me.id).map(u=>'<div class="hl"><button onclick="chal(\''+u.id+'\')">Вызвать</button> '+u.name+(u.role==='t'?' (учитель)':' · '+rate(u))+'</div>').join('');$('pick').classList.remove('hide')}
function chal(to){const a=myMatch();if(a&&a.status==='play')return alert('Сначала закончите текущую партию');
 const oid=G('active_'+to),o=oid&&G('match_fen_'+oid);if(o&&o.status==='play')return alert('Этот игрок сейчас в партии');
 S('chal_'+to,{id:Date.now(),from:me.id,to});$('pick').classList.add('hide');toast('Вызов отправлен: '+nm(to))}
function chals(){const c=G('chal_'+me.id);
 if(c&&c.id!==seenChal&&Date.now()-c.id<120000){seenChal=c.id;curChal=c;const n=$('notice');
  n.innerHTML='⚔ <b>'+nm(c.from)+'</b> бросает вам вызов!<br>10 мин + 5 сек за ход<div class="row"><button class="g" onclick="acc()">Принять</button><button class="red" onclick="dec()">Отклонить</button></div>';n.classList.remove('hide')}
 const r=G('chalres_'+me.id);if(r&&r.id!==seenRes){seenRes=r.id;if(!r.ok)note(nm(r.by)+' отклонил(а) ваш вызов')}}
function dec(){S('chalres_'+curChal.from,{id:curChal.id,ok:false,by:me.id});localStorage.removeItem('chal_'+me.id);$('notice').classList.add('hide')}
function acc(){const c=G('chal_'+me.id);$('notice').classList.add('hide');if(!c)return;
 const m={id:c.id,w:c.from,b:me.id,fen:START,wt:600000,bt:600000,ts:null,turn:'w',status:'play',moves:[],draw:null};
 S('match_fen_'+m.id,m);S('active_'+m.w,m.id);S('active_'+m.b,m.id);localStorage.removeItem('chal_'+me.id);S('chalres_'+c.from,{id:c.id,ok:true,by:me.id})}
function matches(){const m=myMatch();if(!m)return;
 if(m.status==='play'){
  if(ownId!==m.id){ownId=m.id;mode='match';mid=m.id;if(curView!=='room')go('room');board.orientation(m.w===me.id?'white':'black');if(fsb)fsb.orientation(board.orientation());loose=false;refresh()}
  if(m.ts!==null&&rem(m,m.turn)<=0)fin(m,m.turn==='w'?'0-1':'1-0','timeout');
  if(m.draw&&m.draw!==me.id&&!busy){busy=1;const ok=confirm(nm(m.draw)+' предлагает ничью. Принять?');busy=0;const x=G('match_fen_'+m.id);
   if(x&&x.status==='play'){if(ok)fin(x,'1/2-1/2','draw');else{x.draw=null;S('match_fen_'+x.id,x)}}}
 }else if(!done[m.id]){done[m.id]=1;localStorage.removeItem('active_'+me.id);note(msg(m));
  if(mode==='match'){mode='free';mid=null;board&&board.orientation('white')}ownId=null;refresh()}}

function tick(){if(!me)return;
 const lb=lessonHtml(),box=$('lessonBox');if(box.dataset.h!==lb){box.dataset.h=lb;box.innerHTML=lb}
 if(!T()&&curView==='cab'){const b=stuBody(),cb=$('cabBody');if(cb.dataset.h!==b){cb.dataset.h=b;cb.innerHTML=b}}
 if(curView==='room'&&!T()&&susp(me.id)){kick();note('⛔ Учитель отстранил вас от урока');go('cab');return}
 if(curView==='room'&&!T()&&!lessonOn()){note('Урок завершён учителем');go('cab')}
 chals();if(board||curView==='room')matches();
 if(curView==='room'&&board){refresh();camUpd();if(T()){minisUpd();histUpd()}}}
